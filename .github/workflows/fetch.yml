
name: Deploy Vella to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare root website files
        run: |
          set -eu

          mkdir -p _site

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='.gitignore' \
            ./ _site/

          touch _site/.nojekyll

      - name: Diagnose website assets
        run: |
          set -eu

          echo "Checking website root..."

          if [ ! -f "_site/index.html" ]; then
            echo "::error::index.html is missing from the repository root."
            exit 1
          fi

          echo "Found index.html"

          echo ""
          echo "JavaScript files in the deployed website:"
          find _site -type f -name '*.js' -not -path '_site/.git/*' -print || true

          echo ""
          echo "CSS files in the deployed website:"
          find _site -type f -name '*.css' -print || true

          echo ""
          echo "Asset references in index.html:"
          grep -Eo '(src|href)="[^"]+"' _site/index.html || true

          echo ""
          echo "Checking original repository files..."

          find . \
            -path './.git' -prune -o \
            -path './.github' -prune -o \
            -path './_site' -prune -o \
            -path './node_modules' -prune -o \
            -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.css' \) \
            -print || true

          echo ""
          echo "Checking optional assets..."

          if [ -f "_site/img/vella.svg" ]; then
            echo "FOUND: img/vella.svg"
          else
            echo "WARNING: img/vella.svg is missing"
          fi

          if [ -f "_site/sw.js" ]; then
            echo "FOUND: sw.js"
          else
            echo "WARNING: sw.js is missing; continuing without it"
          fi

          echo ""
          echo "Asset diagnostics completed."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
