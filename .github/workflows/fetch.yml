name: Crawl and Mirror Website

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Crawl website
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/mirror.py

      - name: List every mirrored file
        run: |
          echo "All mirrored files:"
          find . -maxdepth 2 -not -path '*/.*' -type f -printf '%s\t%p\n' | sort -k2
          echo "Total files found"

      - name: Upload crawl reports
        uses: actions/upload-artifact@v4
        with:
          name: crawl-reports
          path: |
            crawl-report.json
            urls.txt
          if-no-files-found: warn

      - name: Verify output
        run: test -s index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
