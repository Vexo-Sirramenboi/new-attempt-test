
name: Deploy Vella to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare root website files
        run: |
          set -eu
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='.gitignore' \
            ./ _site/
          touch _site/.nojekyll

      - name: Verify website files
        run: |
          set -eu

          echo "Checking website files..."

          if [ ! -f "_site/index.html" ]; then
            echo "::error::index.html was not found in the repository root."
            exit 1
          fi

          echo "Found index.html"

          echo "JavaScript files:"
          find _site/assets -maxdepth 1 -type f -name '*.js' -print 2>/dev/null || true

          echo "CSS files:"
          find _site/assets -maxdepth 1 -type f -name '*.css' -print 2>/dev/null || true

          echo "Checking Vella assets..."

          for file in \
            "_site/img/vella.svg" \
            "_site/sw.js"
          do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "WARNING: $file is missing"
            fi
          done

          if ! find _site/assets -maxdepth 1 -type f -name '*.js' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::No JavaScript files were found in _site/assets."
            exit 1
          fi

          if ! find _site/assets -maxdepth 1 -type f -name '*.css' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::No CSS files were found in _site/assets."
            exit 1
          fi

          echo "Website file verification completed."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
