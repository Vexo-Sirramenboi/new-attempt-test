
name: Retrieve Website Source and Assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retrieve-v3lla-site
  cancel-in-progress: false

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install download tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget awscli

      - name: Try downloading the public S3 bucket
        shell: bash
        run: |
          mkdir -p retrieved-site

          if aws s3 ls s3://v3lla/ --no-sign-request \
              > /tmp/s3-listing.txt 2>/tmp/s3-error.txt; then
            echo "Public bucket listing is available."
            aws s3 sync s3://v3lla/ retrieved-site/ \
              --no-sign-request \
              --only-show-errors
          else
            echo "Public bucket listing is not available."
            cat /tmp/s3-error.txt
          fi

      - name: Crawl the HTML page and linked assets
        shell: bash
        run: |
          mkdir -p retrieved-site

          wget \
            --recursive \
            --level=5 \
            --page-requisites \
            --adjust-extension \
            --convert-links \
            --no-parent \
            --domains=s3.amazonaws.com \
            --directory-prefix=/tmp/site-crawl \
            --timeout=20 \
            --tries=2 \
            --wait=0.2 \
            https://s3.amazonaws.com/v3lla/index.html \
            || echo "Crawler encountered unavailable or inaccessible resources."

          if [ -d /tmp/site-crawl ]; then
            cp -a /tmp/site-crawl/. retrieved-site/
          fi

          echo "Downloaded file count:"
          find retrieved-site -type f | wc -l

          echo "Downloaded files:"
          find retrieved-site -type f | sort | head -500

      - name: Commit downloaded files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add retrieved-site/

          if git diff --cached --quiet; then
            echo "No new changes to commit."
            exit 0
          fi

          git commit -m "Retrieve publicly accessible website assets"
          git push
