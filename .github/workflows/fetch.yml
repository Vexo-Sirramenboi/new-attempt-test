name: Crawl and Mirror Website

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: write   # <-- Crucial: allows GitHub Actions to push back to the repo

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Crawl website
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/mirror.py

      - name: Verify output
        run: test -s index.html

      - name: Commit and push mirrored files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only commit if there are changes, otherwise skip to avoid empty commit errors
          git diff --staged --quiet || git commit -m "Auto-mirror website updates [skip ci]"
          git push
